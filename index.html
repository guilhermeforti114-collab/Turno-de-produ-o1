<style>

x;pointer-events:auto}.pad button{border:1px solid #a7b5a0;border-radius:10px;background:#21342fe8;color:white;font-size:20px;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.pad .down{grid-row:3}.pad button:active{background:#526d59}
#startScreen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#587354,#172b27 70%);padding:18px;z-index:5}.card{width:min(540px,94vw);text-align:center;padding:32px 24px;background:#172720ed;border:2px solid #9eaa82;border-radius:22px;box-shadow:0 25px 80px #0009}.factoryIcon{font-size:65px}.kicker{font-size:11px;letter-spacing:.2em;color:#f4d17d;font-weight:900}.card h1{font-size:clamp(32px,7vw,54px);line-height:1;margin:12px 0;color:#ffdc83;text-shadow:0 4px #72552b}.card p{color:#e0e8dc;line-height:1.5;font-size:14px}.card button{background:#f2c86f;color:#263127;border:0;border-radius:10px;padding:15px 35px;font-weight:1000;font-size:16px}.hidden{display:none!important}
@media(max-width:650px){.top{padding:7px}.brand,.coins{font-size:11px;padding:7px 9px}.missionBox{top:54px;left:7px;width:190px;max-height:38vh;padding:8px}.missionBox h3{font-size:12px}.mission{font-size:10px;padding:5px 2px}.mapBtn{top:54px;right:7px;padding:7px 9px;font-size:11px}.objective{bottom:8px;left:50%;width:calc(100vw - 150px);margin-left:0;padding:7px 8px}.objective b{font-size:10px}.objective small{font-size:9px}.action{right:8px;bottom:12px;min-width:74px;min-height:50px;padding:8px;font-size:12px}.pad{left:7px;bottom:8px;grid-template-columns:39px 39px 39px;grid-template-rows:36px 36px 36px;gap:3px}.pad button{font-size:17px}.dialog{bottom:78px;padding:11px}.dialog p{font-size:12px}}

<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
 <div class="top"><div class="brand">🏭 TURNO <span>DE PRODUÇÃO</span><br><small style="font-size:9px;color:#d3ddce">XLP · SENAI</small></div><div class="coins">🪙 <span id="coins">0225</span></div></div>
 <div class="missionBox"><h3>❗ MISSÕES</h3><div id="missions"></div></div>
 <button class="mapBtn" id="mapBtn">📍 MAPA</button>
 <div class="objective"><b id="objective">Fale com o Supervisor</b><small id="subobjective">Aproxime-se do NPC e toque em AÇÃO.</small></div>
 <div class="dialog" id="dialog"><strong id="speaker">Supervisor</strong><p id="speech"></p><button id="closeDialog">CONTINUAR</button></div>
 <div class="pad">
  <button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button>
 </div>
 <button class="action" id="action">AÇÃO<br> E</button>
</div>
<div id="startScreen"><div class="card"><div class="factoryIcon">🏭</div><div class="kicker">SIMULADOR INDUSTRIAL · SENAI</div><h1>TURNO DE<br>PRODUÇÃO</h1><p>Explore a fábrica XLP, converse com a equipe e complete missões de produção, reciclagem, manutenção e expedição.</p><p><b>XLP - SENAI</b></p><button id="start">ENTRAR NA FÁBRICA ▶</button></div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let vw=innerWidth,vh=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){vw=innerWidth;vh=innerHeight;canvas.width=vw*dpr;canvas.height=vh*dpr;canvas.style.width=vw+'px';canvas.style.height=vh+'px'}addEventListener('resize',resize);resize();
const W=2600,H=1800,player={x:1250,y:930,speed:250,dir:'down',walk:0};
let cam={x:0,y:0},keys={},coins=225,dialogue=null,missionIndex=0,inject=0,packed=0,borra=false,recycle=false,reject=false,maintenance=false,delivered=false,started=false;
const missions=[
 {title:'Converse com o Supervisor',desc:'Encontre o supervisor perto da entrada.'},
 {title:'Produza 3 peças na Injetora 01',desc:'Use a máquina de injeção três vezes.'},
 {title:'Leve a borra ao triturador',desc:'Recolha a borra e leve ao setor de moagem.'},
 {title:'Separe os resíduos corretamente',desc:'Deposite recicláveis e rejeitos nas lixeiras certas.'},
 {title:'Embale 10 peças',desc:'Use a estação de embalagem até completar 10 peças.'},
 {title:'Fale com o Técnico de Manutenção',desc:'Converse com o técnico no setor de manutenção.'},
 {title:'Envie o lote para expedição',desc:'Converse com o responsável na doca.'},
 {title:'Conclua o turno com o Supervisor',desc:'Volte à entrada e finalize seu turno.'}
];
const npcs=[
 {id:'supervisor',name:'Supervisor Marcos',x:1200,y:470,emoji:'👨🏻‍💼',color:'#355c8c',lines:['Bem-vindo à XLP - SENAI! Hoje você vai acompanhar um turno completo.','Sua primeira tarefa é produzir três peças na Injetora 01. Depois, cuide da borra, dos resíduos e da expedição.','Excelente trabalho! O turno foi concluído. Você ajudou a equipe a manter a produção organizada.']},
 {id:'operator',name:'Operadora Bianca',x:790,y:820,emoji:'👩🏽‍🏭',color:'#a65b48',lines:['Oi! Aqui fazemos a inspeção visual das peças. Observe rebarbas, marcas e defeitos antes de aprovar um lote.','Dica: qualidade vem antes da quantidade.']},
 {id:'technician',name:'Técnico Paulo',x:430,y:1300,emoji:'👨🏽‍🔧',color:'#386f9a',lines:['Sou o técnico de manutenção. Antes de operar, confira proteções, sensores e sinalização. Nunca tente ajustar uma máquina em movimento.','Manutenção preventiva evita paradas e protege todo mundo.']},
 {id:'warehouse',name:'Almoxarife Júlia',x:2050,y:1120,emoji:'👩🏻‍🏭',color:'#46816b',lines:['Recebemos caixas, etiquetas e materiais de embalagem por aqui. Confira sempre a identificação do lote.','Material organizado facilita o trabalho de toda a equipe.']},
 {id:'quality',name:'Inspetor André',x:1650,y:520,emoji:'🧑🏻‍🔬',color:'#7b5c9c',lines:['Amostras aprovadas? Registre o resultado e mantenha o lote identificado.','Um bom operador acompanha o processo e comunica qualquer desvio.']},
 {id:'shipping',name:'Expedição Carla',x:2240,y:1480,emoji:'👩🏽‍💼',color:'#a17b38',lines:['A doca está pronta para receber o lote. Confira as caixas e confirme a entrega.','Lote recebido! Obrigada por manter tudo identificado.']}
];
const stations=[
 {id:'inject',name:'INJETORA 01',x:1770,y:820,w:300,h:190,type:'machine'},
 {id:'grinder',name:'TRITURADOR',x:2120,y:560,w:230,h:150,type:'machine'},
 {id:'recycle',name:'RECICLÁVEIS',x:1580,y:1220,w:95,h:120,type:'bin',color:'#3f986e'},
 {id:'reject',name:'REJEITOS',x:1700,y:1220,w:95,h:120,type:'bin',color:'#b45c4c'},
 {id:'pack',name:'EMBALAGEM',x:1980,y:1260,w:260,h:155,type:'belt'},
 {id:'dock',name:'DOCA 02',x:2240,y:1590,w:280,h:130,type:'dock'},
 {id:'scrap',name:'TAMBOR DE BORRA',x:1390,y:1030,w:100,h:120,type:'drum'},
 {id:'maint',name:'BANCADA TÉCNICA',x:360,y:1480,w:260,h:150,type:'bench'}
];
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=4;ctx.stroke()}}
function text(t,x,y,size=18,color='#f7f2dc',align='center',weight='800'){ctx.fillStyle=color;ctx.font=`${weight} ${size}px system-ui`;ctx.textAlign=align;ctx.fillText(t,x,y)}
function building(x,y,w,h,title,sub,color='#d5c6a0'){rounded(x,y,w,h,16,color,'#8b8065');rounded(x+12,y+12,w-24,38,8,'#59665b','#34483c');text(title,x+w/2,y+38,19,'#fff4d2');text(sub,x+w/2,y+h-17,12,'#3c4637')}
function drawFactory(){
 ctx.fillStyle='#9ca96c';ctx.fillRect(0,0,W,H);
 // outer walls and interior floor
 rounded(70,80,2460,1640,30,'#b9b18b','#6c7056');
 rounded(105,115,2390,1570,22,'#c9c2a5','#817b62');
 // tile floor
 ctx.save();ctx.strokeStyle='#aaa58c';ctx.lineWidth=2;for(let x=120;x<2490;x+=100){ctx.beginPath();ctx.moveTo(x,125);ctx.lineTo(x,1675);ctx.stroke()}for(let y=130;y<1680;y+=90){ctx.beginPath();ctx.moveTo(110,y);ctx.lineTo(2490,y);ctx.stroke()}ctx.restore();
 // yellow walking lanes
 ctx.strokeStyle='#e8b94f';ctx.lineWidth=15;ctx.setLineDash([35,18]);ctx.beginPath();ctx.moveTo(180,950);ctx.lineTo(2380,950);ctx.moveTo(1250,180);ctx.lineTo(1250,1600);ctx.stroke();ctx.setLineDash([]);
 // areas
 building(170,160,500,280,'ESCRITÓRIO','SUPERVISÃO · PCP','#d7c9a8');
 building(730,160,420,280,'CONTROLE DE QUALIDADE','INSPEÇÃO','#d7c9a8');
 building(1380,160,520,280,'PRODUÇÃO','INJETORAS 01–04','#d7c9a8');
 building(1980,160,420,280,'MOAGEM','REAPROVEITAMENTO','#d7c9a8');
 building(170,1190,500,370,'MANUTENÇÃO','FERRAMENTAS E PEÇAS','#c7bea1');
 building(730,1190,420,370,'REFEITÓRIO','PAUSA DOS OPERADORES','#c7bea1');
 building(1380,1190,470,370,'COLETA SELETIVA','RECICLÁVEIS E REJEITOS','#c7bea1');
 building(1900,1190,500,370,'EXPEDIÇÃO','EMBALAGEM E DOCA','#c7bea1');
 // windows / details
 for(let x of [230,330,430,530,790,890,990,1450,1550,1650,2050,2150,2250]){rounded(x,205,62,85,7,'#8db5bd','#586f70');rounded(x+8,213,46,69,4,'#b6d6d4')}
 // safety stripes at machine zones
 rounded(1430,540,900,520,22,'#b8b39d','#737c68');
 for(let i=0;i<12;i++){ctx.fillStyle=i%2?'#d9ad43':'#303d36';ctx.save();ctx.translate(1450+i*72,540);ctx.rotate(-.45);ctx.fillRect(0,0,26,18);ctx.restore()}
 text('ÁREA DE PRODUÇÃO',1880,585,20,'#425047');
 // shelves
 for(let y of [610,730,850]){rounded(180,y,420,30,5,'#7a5540','#493c31');for(let i=0;i<6;i++)rounded(195+i*65,y-45,48,40,4,'#b78c50','#705338')}
 for(let y of [600,710,820]){rounded(750,y,330,25,5,'#7a5540','#493c31');for(let i=0;i<5;i++)rounded(765+i*62,y-39,45,34,4,'#91a17a','#53664d')}
 // conveyor
 rounded(1900,1050,470,60,10,'#4e5d58','#263b35');for(let x=1920;x<2350;x+=45){ctx.fillStyle='#a8a99b';ctx.beginPath();ctx.arc(x,1080,13,0,Math.PI*2);ctx.fill()}
 // pallets and crates
 for(let [x,y] of [[780,1010],[900,1010],[2150,850],[2260,850],[1050,620]]){rounded(x,y,90,70,6,'#9b7041','#65482e');for(let i=0;i<2;i++){ctx.strokeStyle='#d9b77b';ctx.beginPath();ctx.moveTo(x+8,y+10+i*25);ctx.lineTo(x+82,y+10+i*25);ctx.stroke()}}
 // signs
 text('XLP - SENAI',1280,95,30,'#fff0c1');
}
function drawStation(s){
 const x=s.x,y=s.y;
 if(s.type==='machine'){rounded(x-s.w/2,y-s.h/2,s.w,s.h,18,'#326b9e','#193e5c');rounded(x-s.w/2+20,y-s.h/2+20,s.w-40,70,9,'#263a48','#a8bdc4');rounded(x-48,y+20,96,42,7,'#91a7a2','#d0d7bd');text(s.name,x,y+s.h/2-12,17,'#fff')}
 if(s.type==='bin'){rounded(x-s.w/2,y-s.h/2,s.w,s.h,12,s.color,'#e4e2c9');text('♻',x,y+8,35);text(s.name,x,y+s.h/2+22,12)}
 if(s.type==='belt'){rounded(x-s.w/2,y-s.h/2,s.w,s.h,12,'#687b70','#344a40');for(let i=0;i<5;i++)rounded(x-s.w/2+15+i*48,y-35,38,50,5,'#b88b4f','#705535');text(s.name,x,y+s.h/2+22,15)}
 if(s.type==='dock'){rounded(x-s.w/2,y-s.h/2,s.w,s.h,12,'#8c9a8d','#536b5c');rounded(x-95,y-35,190,70,8,'#354e50','#c3d1b9');text(s.name,x,y+8,22)}
 if(s.type==='drum'){rounded(x-40,y-55,80,110,15,'#6b856f','#d1d5b7');text('BORRA',x,y+5,14);text('PLÁSTICA',x,y+25,10)}
 if(s.type==='bench'){rounded(x-s.w/2,y-s.h/2,s.w,s.h,12,'#657d88','#2f4c56');text(s.name,x,y+7,16)}
}
function drawNpc(n){ctx.save();ctx.translate(n.x,n.y);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,20,27,9,0,0,Math.PI*2);ctx.fill();rounded(-22,-30,44,48,12,n.color,'#283a32');ctx.beginPath();ctx.arc(0,-43,18,0,Math.PI*2);ctx.fillStyle='#c98f6a';ctx.fill();text(n.emoji,0,-34,25);rounded(-35,-92,70,24,8,'#fff3d7','#75684f');text(n.name.split(' ')[0],0,-75,11,'#344239');ctx.restore()}
function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,20,25,9,0,0,Math.PI*2);ctx.fill();rounded(-20,-29,40,48,10,'#d6c9a7','#4c5545');ctx.beginPath();ctx.arc(0,-43,18,0,Math.PI*2);ctx.fillStyle='#c98e6c';ctx.fill();ctx.fillStyle='#4b3025';ctx.beginPath();ctx.arc(0,-49,18,Math.PI,Math.PI*2);ctx.fill();text('👷',0,-35,22);ctx.restore()}
function nearest(){let best=null,dist=1e9;for(const n of npcs){let d=Math.hypot(n.x-player.x,n.y-player.y);if(d<dist){dist=d;best={kind:'npc',obj:n,d}}}for(const s of stations){let d=Math.hypot(s.x-player.x,s.y-player.y);if(d<dist){dist=d;best={kind:'station',obj:s,d}}}return best&&best.d<115?best:null}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,vw,vh);let scale=Math.min(vw/1100,vh/700);let viewW=vw/scale,viewH=vh/scale;cam.x=Math.max(0,Math.min(W-viewW,player.x-viewW/2));cam.y=Math.max(0,Math.min(H-viewH,player.y-viewH/2));ctx.scale(dpr*scale,dpr*scale);ctx.translate(-cam.x,-cam.y);drawFactory();stations.forEach(drawStation);npcs.forEach(drawNpc);drawPlayer();let near=nearest();if(near){ctx.fillStyle='#fff2a8';ctx.beginPath();ctx.arc(player.x,player.y-100,18,0,Math.PI*2);ctx.fill();text('!',player.x,player.y-93,22,'#34412f')} }
function updateMissions(){document.getElementById('missions').innerHTML=missions.map((m,i)=>`<div class="mission ${i<missionIndex?'done':''}"><span class="dot"></span>${m.title}${i===missionIndex?' ◀':''}</div>`).join('');let m=missions[Math.min(missionIndex,missions.length-1)];document.getElementById('objective').textContent=missionIndex>=missions.length?'Turno concluído!':m.title;document.getElementById('subobjective').textContent=missionIndex>=missions.length?'Parabéns! Você completou todas as missões.':m.desc;document.getElementById('coins').textContent=String(coins).padStart(4,'0')}
function say(n,txt){dialogue={npc:n};document.getElementById('speaker').textContent=n.name;document.getElementById('speech').textContent=txt;document.getElementById('dialog').classList.add('show')}
function closeDialog(){document.getElementById('dialog').classList.remove('show');dialogue=null}
function interact(){if(!started)return;if(dialogue){closeDialog();return}let near=nearest();if(!near){return}
 if(near.kind==='npc'){let n=near.obj;let line=n.lines[0];if(n.id==='supervisor'&&missionIndex===0){missionIndex++;line=n.lines[0]+' '+n.lines[1];coins+=10;updateMissions()}else if(n.id==='technician'&&missionIndex===5){missionIndex++;maintenance=true;line=n.lines[0]+' '+n.lines[1];coins+=20;updateMissions()}else if(n.id==='shipping'&&missionIndex===6){missionIndex++;delivered=true;line=n.lines[0]+' '+n.lines[1];coins+=30;updateMissions()}else if(n.id==='supervisor'&&missionIndex===7){missionIndex++;line=n.lines[2];coins+=50;updateMissions()}else if(n.id==='operator'&&missionIndex===1){line=n.lines[0]}else if(n.id==='quality'&&missionIndex>=2){line=n.lines[0]}else if(n.id==='warehouse'){line=n.lines[0]}say(n,line);return}
 const s=near.obj;
 if(s.id==='inject'&&missionIndex===1){inject++;coins+=5;if(inject>=3){missionIndex++;say({name:'Sistema'},'Três peças produzidas! Agora recolha a borra e leve ao triturador.');}else say({name:'Injetora 01'},`Peça produzida: ${inject}/3. Continue até completar o lote.`)}
 else if(s.id==='scrap'&&missionIndex===2&&!borra){borra=true;say({name:'Tambor de borra'},'Borra recolhida e identificada. Agora leve o material ao triturador.')}
 else if(s.id==='grinder'&&missionIndex===2&&borra){missionIndex++;coins+=15;say({name:'Triturador'},'Borra triturada e armazenada para reaproveitamento. Agora separe os resíduos.')}
 else if(s.id==='recycle'&&missionIndex===3&&!recycle){recycle=true;say({name:'Coleta seletiva'},'Recicláveis separados corretamente. Agora coloque os rejeitos no recipiente certo.')}
 else if(s.id==='reject'&&missionIndex===3&&recycle&&!reject){reject=true;missionIndex++;coins+=15;say({name:'Coleta seletiva'},'Separação concluída! Siga para a estação de embalagem.')}
 else if(s.id==='pack'&&missionIndex===4){packed=Math.min(10,packed+2);coins+=2;if(packed>=10){missionIndex++;say({name:'Embalagem'},'Dez peças embaladas e identificadas! Agora fale com o técnico de manutenção.')}else say({name:'Embalagem'},`Peças embaladas: ${packed}/10.`)}
 else if(s.id==='maint'&&missionIndex===5){say({name:'Bancada técnica'},'Área de manutenção: ferramentas organizadas e equipamentos sinalizados. Agora converse com o técnico Paulo.')}
 else if(s.id==='dock'&&missionIndex===6){say({name:'Doca 02'},'A doca está pronta. Converse com a responsável pela expedição para confirmar o envio.')}
 else say({name:s.name},'Esta estação ainda não faz parte da sua missão atual. Converse com a equipe para receber orientações.');
 updateMissions();}
function moveLoop(){if(!started){requestAnimationFrame(moveLoop);return}let dx=0,dy=0;if(keys.left||keys.ArrowLeft||keys.a)dx--;if(keys.right||keys.ArrowRight||keys.d)dx++;if(keys.up||keys.ArrowUp||keys.w)dy--;if(keys.down||keys.ArrowDown||keys.s)dy++;let len=Math.hypot(dx,dy)||1;if(dx||dy){player.x+=dx/len*player.speed/60;player.y+=dy/len*player.speed/60;player.x=Math.max(130,Math.min(W-130,player.x));player.y=Math.max(135,Math.min(H-135,player.y));player.walk+=.1;player.dir=dy<0?'up':dy>0?'down':dx<0?'left':'right'}draw();requestAnimationFrame(moveLoop)}
document.getElementById('start').onclick=()=>{started=true;document.getElementById('startScreen').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');updateMissions();draw();requestAnimationFrame(moveLoop)};
document.getElementById('action').onclick=interact;document.getElementById('closeDialog').onclick=closeDialog;
document.querySelectorAll('[data-dir]').forEach(b=>{let k=b.dataset.dir;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(k==='e'||k==='enter'||k===' ')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>keys={});
document.getElementById('mapBtn').onclick=()=>{let el=document.querySelector('.missionBox');el.style.display=el.style.display==='none'?'block':'none'};
draw();
})();
</script></body></html>
